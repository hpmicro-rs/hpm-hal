[package]
name = "hpm5e00evk"
version = "0.1.0"
edition = "2024"
resolver = "2"

[dependencies]
hpm-hal = { path = "../..", features = ["hpm5e31", "rt", "embassy", "time-driver-gptmr0"] }

panic-halt = "1.0.0"

embedded-hal = "1.0.0"
embedded-hal-nb = "1.0.0"
nb = "1.1.0"
riscv = { version = "0.15.0", features = ["critical-section-single-hart"] }

embassy-time = { version = "0.5.0", features = ["tick-hz-1_000_000"] }
embassy-executor = { version = "0.9.1", features = [
    "nightly",
    "arch-riscv32",
    "executor-thread",
] }
embassy-usb = { version = "0.5.1", features = [
    "max-handler-count-8",
    "max-interface-count-8",
] }
futures-util = { version = "0.3.31", default-features = false }
static_cell = "2"

[profile.release]
strip = false
lto = true
opt-level = "z"
debug = 2
