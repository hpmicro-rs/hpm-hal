[package]
name = "hpm5e00evk"
version = "0.1.0"
edition = "2024"
resolver = "2"

[dependencies]
hpm-hal = { path = "../..", features = [
    "hpm5e31",
    "rt",
    "embassy",
    "time-driver-gptmr0",
    "usb-diagnostics",
    "runtime-diagnostics",
] }

panic-halt = "1.0.0"

defmt = "1.0.1"
defmt-rtt = "1.1.0"
embedded-hal = "1.0.0"
embedded-hal-nb = "1.0.0"
bosch-bme680 = "1.0.4"
nb = "1.1.0"
riscv = { version = "0.16.1", features = ["critical-section-single-hart"] }

embassy-time = { version = "0.5.1", features = ["tick-hz-1_000_000"] }
embassy-embedded-hal = "0.6.0"
embassy-executor = { version = "0.10.0", features = [
    "nightly",
    "platform-riscv32",
    "executor-thread",
] }
embassy-sync = "0.8.0"
embassy-usb = { version = "0.6.0", features = [
    "max-handler-count-8",
    "max-interface-count-8",
] }
futures-util = { version = "0.3.32", default-features = false }
static_cell = "2"

[profile.release]
strip = false
lto = true
opt-level = "z"
debug = 2
